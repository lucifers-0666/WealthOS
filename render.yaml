# ─────────────────────────────────────────────
# WealthOS — Render deployment config
# https://render.com
# ─────────────────────────────────────────────
services:
  - type: web
    name: wealthos-api
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: NEWSAPI_KEY
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: DEFAULT_CURRENCY
        value: INR
      - key: DEFAULT_EXCHANGE
        value: NSE
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: FRONTEND_URL
        sync: false
