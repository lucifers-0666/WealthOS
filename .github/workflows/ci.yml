name: WealthOS CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '20'

jobs:
  # ── Frontend checks ─────────────────────────────────────────────────────────
  frontend:
    name: Frontend — Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint 2>&1 || echo "::warning::ESLint warnings found"
        continue-on-error: true

      - name: Type check (if tsconfig exists)
        run: |
          if [ -f tsconfig.json ]; then npm run type-check 2>&1 || echo "::warning::Type errors found"; fi
        continue-on-error: true

      - name: Production build
        run: npm run build
        env:
          VITE_API_URL: http://localhost:8000
          VITE_WS_URL: ws://localhost:8000/ws/market

      - name: Verify build output
        run: |
          if [ ! -d "dist" ]; then echo "::error::Build output dist/ not found"; exit 1; fi
          echo "Build size:"
          du -sh dist/

  # ── Backend checks ───────────────────────────────────────────────────────────
  backend:
    name: Backend — Lint & Import check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt 2>/dev/null || pip install fastapi uvicorn apscheduler httpx websockets supabase

      - name: Ruff lint
        run: |
          pip install ruff
          ruff check WealthOS/ --ignore E501,F401 2>&1 || echo "::warning::Ruff warnings found"
        continue-on-error: true

      - name: Python syntax check
        run: |
          find WealthOS -name '*.py' -exec python -m py_compile {} + && echo "All Python files compile OK"

      - name: Check api.py starts without errors
        run: |
          cd WealthOS
          python -c "
import ast, sys
with open('api.py') as f:
    src = f.read()
try:
    ast.parse(src)
    print('api.py: syntax OK')
except SyntaxError as e:
    print(f'SYNTAX ERROR in api.py: {e}')
    sys.exit(1)
"

  # ── Docker build check ───────────────────────────────────────────────────────
  docker:
    name: Docker build check
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            --build-arg VITE_API_URL=http://localhost:8000 \
            --build-arg VITE_WS_URL=ws://localhost:8000/ws/market \
            -t wealthos:ci .
        continue-on-error: true
